spring.application.name=springboot-backend
server.port=8080

# Domyślnie działa od razu na H2, bez instalowania PostgreSQL.
spring.datasource.url=jdbc:h2:mem:wroclaw_events;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# W razie przejścia na PostgreSQL ustaw profil/properties:
# spring.datasource.url=jdbc:postgresql://localhost:5432/wroclaw_events
# spring.datasource.username=postgres
# spring.datasource.password=postgres
